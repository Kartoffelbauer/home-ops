services:
  # --- Init Service: Prepares config permissions before Home Assistant starts ---
  home-assistant-init:
    extends:
      file: ../../shared/templates.yml
      service: base-init
    container_name: home-assistant-init

    # Execution: Install mosquitto tools, build password file, and fix permissions
    command: >
      sh -c "
        cp /config/configuration.yaml /data-config &&
        touch /data-config/automations.yaml /data-config/scripts.yaml /data-config/scenes.yaml /data-config/secrets.yaml &&
        chown -R 0:0 /data-config /data-media
      "

    # State: Mount configuration and data directories
    volumes:
      - ./config:/config
      - ./data/config:/data-config
      - ./data/media:/data-media

  # --- Storage Init Service: Provisions internal storage entries (HTTP & MQTT) ---
  home-assistant-storage-init:
    extends:
      file: ../../shared/templates.yml
      service: base-init-extended
    container_name: home-assistant-storage-init

    # Lifecycle: Runs after directory baseline exists, before network extensions are fetched
    depends_on:
      home-assistant-init:
        condition: service_completed_successfully

    # Execution: Run modular storage provisioners sequentially
    entrypoint:
      - /bin/sh
      - /init.sh

    # Configuration: Pass HTTP proxy/port settings and broker credentials
    environment:
      HOMEASSISTANT_HTTP_SERVER_PORT: "${HOMEASSISTANT_HTTP_SERVER_PORT:-8123}"
      HOMEASSISTANT_HTTP_TRUSTED_PROXIES: "${HOMEASSISTANT_HTTP_TRUSTED_PROXIES:-127.0.0.1/32,172.16.0.0/12,::1/128,fd00:172:29::/64}"
      ZIGBEE_MOSQUITTO_PASSWORD_HA: "${ZIGBEE_MOSQUITTO_PASSWORD_HA:-}"

    # State: Mount data config volume and init script
    volumes:
      - ./data/config:/config
      - ./init/init-storage.sh:/init.sh:ro

  # --- Ext Init Service: Downloads Home Assistant custom components ---
  home-assistant-ext-init:
    extends:
      file: ../../shared/templates.yml
      service: base-init-extended
    container_name: home-assistant-ext-init

    # Lifecycle: Wait for required services to be ready before running
    depends_on:
      home-assistant-storage-init:
        condition: service_completed_successfully
      pihole:
        condition: service_healthy

    # Execution: Set base entrypoint
    entrypoint:
      - /bin/sh
      - /init.sh

    # Configuration: Environment variables
    environment:
      GITHUB_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN:-}

    # Execution: Download and install custom extensions via script
    command:
      # Integration extensions
      - "integration=3dg1luk43/ha_washdata:${HOMEASSISTANT_EXT_HA_WASHDATA_DOCKER_TAG:-latest}"
      - "integration=DAB-LABS/HAIR:${HOMEASSISTANT_EXT_HAIR_DOCKER_TAG:-latest}"
      - "integration=edmogeor/hass-ga-manual-ui:${HOMEASSISTANT_EXT_HASS_GA_MANUAL_UI_DOCKER_TAG:-latest}"
      # - "integration=frenck/spook:${HOMEASSISTANT_EXT_SPOOK_DOCKER_TAG:-latest}" # Used for cleaning up old entities, but not needed for normal operation

      # Frontend extensions
      - "frontend=brunosabot/streamline-card:${HOMEASSISTANT_EXT_STREAMLINE_CARD_DOCKER_TAG:-latest}"
      - "frontend=custom-cards/button-card:${HOMEASSISTANT_EXT_BUTTON_CARD_DOCKER_TAG:-latest}"
      - "frontend=francois-le-ko4la/lovelace-entity-progress-card:${HOMEASSISTANT_EXT_LOVELACE_ENTITY_PROGRESS_CARD_DOCKER_TAG:-latest}"
      - "frontend=piitaya/lovelace-mushroom:${HOMEASSISTANT_EXT_LOVELACE_MUSHROOM_DOCKER_TAG:-latest}"

    # State: Mount the config volume and script
    volumes:
      - ./data/config:/config
      - ./init/init-extensions.sh:/init.sh:ro

  # --- Main Smart Home Service: Home Assistant ---
  home-assistant:
    extends:
      file: ../../shared/templates.yml
      service: base-secure-outbound
    image: ghcr.io/home-assistant/home-assistant:${HOMEASSISTANT_DOCKER_TAG:-2026.8}
    container_name: home-assistant

    # Connectivity: Use host network mode for device discovery (mDNS)
    network_mode: host

    # Security: Lock file system and explicitly grant required kernel capabilities
    read_only: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - apparmor:unconfined

    # Lifecycle: Wait for extensions
    depends_on:
      home-assistant-ext-init:
        condition: service_completed_successfully

    # Configuration: Environment variables
    environment:
      HOMEASSISTANT_LOG_LEVEL: "${HOMEASSISTANT_LOG_LEVEL:-info}"

    # State: Mount config and media directories and in-memory temp areas
    volumes:
      - ./data/config:/config
      - ./config/streamline-templates.yaml:/config/www/community/streamline-card/streamline_templates.yaml:ro
      - ./data/media:/media
      - /run/dbus:/run/dbus:ro
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev
      - /run:rw,exec,nosuid,nodev

    # Monitoring: Internal check targeting the native API
    healthcheck:
      test: "wget -qO /dev/null http://127.0.0.1:8123/ || exit 1"

# --- Global Network Definitions ---
networks:
  outbound-public: