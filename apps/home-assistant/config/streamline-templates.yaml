# ==============================================================================
# Template: light_smart_control
# Description: Reusable Mushroom light card with inline Custom Features sliders
#              for brightness and color temperature (Kelvin). Dynamically hides
#              manual temperature controls when Adaptive Lighting is active, and
#              collapses all sliders when the light is off, when an optional
#              Night Light mode binary sensor is active, or when a parent sets
#              --hide-inline-controls: 1 (e.g. the header of an expanded
#              expander card).
# ==============================================================================

light_smart_control:
  default:
    - name: none
    - light_entity: none
    - night_light_entity: none
    - adaptive_color_entity: none
    - toggle_script_entity: none
  card:
    type: custom:mushroom-template-card
    entity: "[[light_entity]]"
    primary: >-
      {% set name = '[[name]]' %}
      {% if name and name | lower != 'none' %}
        {{ name }}
      {% else %}
        {{ state_attr('[[light_entity]]', 'friendly_name') | default('Licht', true) }}
      {% endif %}
    secondary: >-
      {% set nl = '[[night_light_entity]]' %}
      {% set is_nl = nl not in ['none', ''] and is_state(nl, 'on') %}
      {% if is_nl %}
        Nachtlicht
      {% elif is_state('[[light_entity]]', 'on') %}
        {{ (state_attr('[[light_entity]]', 'brightness') | float(0) / 2.55) | round }}%
      {% elif is_state('[[light_entity]]', 'off') %}
        Aus
      {% else %}
        Nicht verfügbar
      {% endif %}
    icon: >-
      {{ 'mdi:lightbulb' if is_state('[[light_entity]]', 'on') else 'mdi:lightbulb-off' }}
    color: >-
      {% if is_state('[[light_entity]]', 'on') %}
        {% set rgb = state_attr('[[light_entity]]', 'rgb_color') %}
        {{ 'rgb(' ~ rgb | join(',') ~ ')' if rgb else 'amber' }}
      {% endif %}
    badge_icon: >-
      {% set nl = '[[night_light_entity]]' %}
      {% if nl not in ['none', ''] and is_state(nl, 'on') %}
        mdi:weather-night
      {% endif %}
    badge_color: >-
      {% set nl = '[[night_light_entity]]' %}
      {% if nl not in ['none', ''] and is_state(nl, 'on') %}
        deep-purple
      {% endif %}
    tap_action:
      action: perform-action
      perform_action: "[[toggle_script_entity]]"
      data:
        light_entity: "[[light_entity]]"
        remember_brightness: true
    icon_tap_action:
      action: perform-action
      perform_action: "[[toggle_script_entity]]"
      data:
        light_entity: "[[light_entity]]"
        remember_brightness: true
    features_position: inline
    features:
      - type: custom:service-call
        entries:
          - type: slider
            entity_id: "[[light_entity]]"
            value_attribute: brightness
            unit_of_measurement: "%"
            range: [1, 100]
            tap_action:
              action: perform-action
              perform_action: light.turn_on
              target:
                entity_id: "[[light_entity]]"
              data:
                brightness_pct: "{{ value | int }}"
            styles: |-
              :host {
                --color: var(--feature-color);
                --thumb-transition: none;
              }
          - type: slider
            entity_id: "[[light_entity]]"
            value_attribute: color_temp_kelvin
            unit_of_measurement: " K"
            thumb: line
            range:
              - "{{ state_attr('[[light_entity]]', 'min_color_temp_kelvin') or 2000 }}"
              - "{{ state_attr('[[light_entity]]', 'max_color_temp_kelvin') or 6500 }}"
            tap_action:
              action: perform-action
              perform_action: light.turn_on
              target:
                entity_id: "[[light_entity]]"
              data:
                color_temp_kelvin: "{{ value | int }}"
            styles: |-
              :host {
                --color: linear-gradient(90deg, rgb(255, 160, 0), rgb(255, 255, 251));
                --background-opacity: 1;
                --thumb-transition: none;
              }
          - type: button
            entity_id: "[[light_entity]]"
            icon: mdi:thermometer
            tap_action:
              action: fire-dom-event
              event_type: cf-attributes
              attributes:
                mode: [temp]
            styles: |-
              :host {
                flex: 0 0 var(--feature-height, 42px);
              }
          - type: button
            entity_id: "[[light_entity]]"
            icon: mdi:brightness-6
            tap_action:
              action: fire-dom-event
              event_type: cf-attributes
              attributes:
                mode: [temp]
            styles: |-
              :host {
                flex: 0 0 var(--feature-height, 42px);
              }
        styles: |-
          {% set is_off = not is_state('[[light_entity]]', 'on') %}
          {% set nl = '[[night_light_entity]]' %}
          {% set is_nl = nl not in ['none', ''] and is_state(nl, 'on') %}
          {% set adapt = '[[adaptive_color_entity]]' %}
          {% set is_adapt = adapt not in ['none', ''] and is_state(adapt, 'on') %}

          {% if is_off or is_nl %}
          :host {
            display: none !important;
          }
          {% endif %}
          @container style(--hide-inline-controls: 1) {
            :host {
              display: none !important;
            }
          }
          custom-feature-slider:nth-of-type(2) {
            position: absolute;
            visibility: hidden;
          }
          custom-feature-button:nth-of-type(2) {
            display: none;
          }
          {% if is_adapt %}
          custom-feature-button:nth-of-type(1) {
            display: none !important;
          }
          {% else %}
          :host([mode='temp']) custom-feature-slider:nth-of-type(1) {
            position: absolute;
            visibility: hidden;
          }
          :host([mode='temp']) custom-feature-slider:nth-of-type(2) {
            position: relative;
            visibility: visible;
          }
          :host([mode='temp']) custom-feature-button:nth-of-type(1) {
            display: none;
          }
          :host([mode='temp']) custom-feature-button:nth-of-type(2) {
            display: flex;
          }
          {% endif %}


# ==============================================================================
# Template: climate_smart_control
# Description: Reusable Mushroom climate card with an inline Custom Features row
#              that mirrors the mushroom-climate-card. The row toggles between a
#              target temperature spinbox and an HVAC mode selector via the
#              button on its right. The selector never shows off and also skips
#              any modes listed in hidden_hvac_modes (comma separated). All
#              controls are collapsed when the device is off or unavailable, or
#              when a parent sets --hide-inline-controls: 1 (e.g. the header of
#              an expanded expander card).
# ==============================================================================

climate_smart_control:
  default:
    - name: none
    - climate_entity: none
    - hidden_hvac_modes: ""
  card:
    type: custom:mushroom-template-card
    entity: "[[climate_entity]]"
    primary: >-
      {% set name = '[[name]]' %}
      {% if name and name | lower != 'none' %}
        {{ name }}
      {% else %}
        {{ state_attr('[[climate_entity]]', 'friendly_name') | default('Klima', true) }}
      {% endif %}
    secondary: >-
      {% set modes = {
        'auto': 'Automatisch',
        'heat': 'Heizen',
        'cool': 'Kühlen',
        'fan_only': 'Lüften',
        'dry': 'Entfeuchten',
        'heat_cool': 'Heizen/Kühlen',
        'off': 'Aus'
      } %}
      {% set mode = states('[[climate_entity]]') %}
      {% set current = state_attr('[[climate_entity]]', 'current_temperature') %}
      {% if mode in modes %}
        {{ modes[mode] }}{{ ' · ' ~ current ~ ' °C' if current is not none }}
      {% else %}
        Nicht verfügbar
      {% endif %}
    icon: mdi:air-conditioner
    color: >-
      {{ {
        'auto': 'green',
        'heat': 'deep-orange',
        'cool': 'blue',
        'fan_only': 'cyan',
        'dry': 'amber',
        'heat_cool': 'purple'
      }.get(states('[[climate_entity]]'), '') }}
    tap_action:
      action: toggle
    icon_tap_action:
      action: toggle
    hold_action:
      action: fire-dom-event
      browser_mod:
        service: sequence
        data:
          sequence:
            - service: browser_mod.close_popup
            - service: browser_mod.more_info
              data:
                entity: "[[climate_entity]]"
    icon_hold_action:
      action: fire-dom-event
      browser_mod:
        service: sequence
        data:
          sequence:
            - service: browser_mod.close_popup
            - service: browser_mod.more_info
              data:
                entity: "[[climate_entity]]"
    features_position: inline
    features:
      - type: custom:service-call
        entries:
          - type: spinbox
            entity_id: "[[climate_entity]]"
            value_attribute: temperature
            unit_of_measurement: °C
            label: "{{ value }}{{ unit }}"
            range:
              - "{{ state_attr('[[climate_entity]]', 'min_temp') or 16 }}"
              - "{{ state_attr('[[climate_entity]]', 'max_temp') or 31 }}"
            step: "{{ state_attr('[[climate_entity]]', 'target_temp_step') or 1 }}"
            tap_action:
              action: perform-action
              perform_action: climate.set_temperature
              target:
                entity_id: "[[climate_entity]]"
              data:
                temperature: "{{ value | float }}"
            styles: |-
              :host {
                max-width: 128px;
                margin-inline-start: auto;
              }
          - type: button
            entity_id: "[[climate_entity]]"
            icon: "{{ {'auto': 'mdi:thermostat-auto', 'heat': 'mdi:fire', 'cool': 'mdi:snowflake', 'fan_only': 'mdi:fan', 'dry': 'mdi:water-percent', 'heat_cool': 'mdi:sun-snowflake-variant'}[states('[[climate_entity]]')] or 'mdi:thermostat' }}"
            tap_action:
              action: fire-dom-event
              event_type: cf-attributes
              attributes:
                view: [modes]
            styles: |-
              :host {
                flex: 0 0 var(--feature-height, 42px);
              }
          - type: selector
            entity_id: "[[climate_entity]]"
            option_type: template
            options_template: "{{ (state_attr('[[climate_entity]]', 'hvac_modes') or []) | difference(['off'].concat(('[[hidden_hvac_modes]]' | replace(' ', '')).split(','))) | join(',') }}"
            option_template:
              icon: "{{ {'auto': 'mdi:thermostat-auto', 'heat': 'mdi:fire', 'cool': 'mdi:snowflake', 'fan_only': 'mdi:fan', 'dry': 'mdi:water-percent', 'heat_cool': 'mdi:sun-snowflake-variant'}[option] or 'mdi:thermostat' }}"
              tap_action:
                action: perform-action
                perform_action: climate.set_hvac_mode
                target:
                  entity_id: "[[climate_entity]]"
                data:
                  hvac_mode: "{{ option | safe }}"
              styles: |-
                :host {
                  --color: var(--state-climate-{{ option }}-color, var(--state-inactive-color));
                }
                :host(.selected) {
                  --opacity: 0.2 !important;
                  --hover-opacity: 0.3 !important;
                  --icon-color: var(--color);
                }
          - type: button
            entity_id: "[[climate_entity]]"
            icon: mdi:thermometer
            tap_action:
              action: fire-dom-event
              event_type: cf-attributes
              attributes:
                view: [modes]
            styles: |-
              :host {
                flex: 0 0 var(--feature-height, 42px);
              }
        styles: |-
          {% set is_off = states('[[climate_entity]]') in ['off', 'unavailable', 'unknown'] %}

          {% if is_off %}
          :host {
            display: none !important;
          }
          {% endif %}
          @container style(--hide-inline-controls: 1) {
            :host {
              display: none !important;
            }
          }
          custom-feature-selector,
          custom-feature-button:nth-of-type(2) {
            display: none;
          }
          :host([view='modes']) custom-feature-spinbox,
          :host([view='modes']) custom-feature-button:nth-of-type(1) {
            display: none;
          }
          :host([view='modes']) custom-feature-selector,
          :host([view='modes']) custom-feature-button:nth-of-type(2) {
            display: flex;
          }


# ==============================================================================
# Template: media_player_smart_control
# Description: Reusable Mushroom card for media players and media player groups
#              with inline Custom Features controls for volume and source
#              selection. Toggles the whole group on tap (natively, or IR-safe
#              via an optional toggle script), lists all members grouped by
#              state, and switches between volume and source via an icon when
#              both are enabled. Collapses all controls when the player is off,
#              and hides the source dropdown when the device is off, or when a
#              parent sets --hide-inline-controls: 1 (e.g. the header of an
#              expanded expander card).
# ==============================================================================

media_player_smart_control:
  default:
    - name: none
    - icon: auto
    - media_player_entity: none
    - toggle_script_entity: homeassistant.toggle
    - member_labels: none
    - show_volume_bool: false
    - show_source_bool: false
  card:
    type: custom:mushroom-template-card
    entity: "[[media_player_entity]]"
    primary: >-
      {% set name = '[[name]]' %}
      {% if name and name | lower != 'none' %}
        {{ name }}
      {% else %}
        {{ state_attr('[[media_player_entity]]', 'friendly_name') | default('Medien', true) }}
      {% endif %}
    secondary: >-
      {% set inactive = ['off', 'standby', 'unavailable', 'unknown'] %}
      {% set members = state_attr('[[media_player_entity]]', 'entity_id') or [] %}
      {% if members | count == 0 %}
        {{ 'Aus' if states('[[media_player_entity]]') in inactive else 'An' }}
      {% else %}
        {% set custom = '[[member_labels]]' %}
        {% set labels = custom.split(',') | map('trim') | list if custom != 'none' else [] %}
        {% set ns = namespace(on=[], off=[]) %}
        {% for id in members %}
          {% set label = labels[loop.index0]
               | default(state_attr(id, 'friendly_name'), true)
               | default(id, true) %}
          {% if states(id) in inactive %}
            {% set ns.off = ns.off + [label] %}
          {% else %}
            {% set ns.on = ns.on + [label] %}
          {% endif %}
        {% endfor %}
        {{ [
             ns.on | join(', ') ~ ' an' if ns.on else '',
             ns.off | join(', ') ~ ' aus' if ns.off else ''
           ] | select | join(' · ') }}
      {% endif %}
    icon: >-
      {% set icon = '[[icon]]' %}
      {% if icon not in ['none', 'auto', ''] %}
        {{ icon }}
      {% elif state_attr('[[media_player_entity]]', 'entity_id') %}
        mdi:play-box-multiple-outline
      {% else %}
        mdi:play-box-outline
      {% endif %}
    color: >-
      {{ 'deep-purple' if states('[[media_player_entity]]') not in ['off', 'standby', 'unavailable', 'unknown'] }}
    tap_action:
      action: perform-action
      perform_action: "[[toggle_script_entity]]"
      target:
        entity_id: "[[media_player_entity]]"
    icon_tap_action:
      action: perform-action
      perform_action: "[[toggle_script_entity]]"
      target:
        entity_id: "[[media_player_entity]]"
    features_position: inline
    features:
      - type: custom:service-call
        entries:
          - type: spinbox
            entity_id: "{{ (state_attr('[[media_player_entity]]', 'entity_id') or ['[[media_player_entity]]']) | first }}"
            icon: mdi:volume-high
            decrement:
              icon: mdi:volume-minus
              tap_action:
                action: perform-action
                perform_action: media_player.volume_down
                target:
                  entity_id: "{{ (state_attr('[[media_player_entity]]', 'entity_id') or ['[[media_player_entity]]']) | first }}"
              hold_action:
                action: repeat
                repeat_delay: 250
            increment:
              icon: mdi:volume-plus
              tap_action:
                action: perform-action
                perform_action: media_player.volume_up
                target:
                  entity_id: "{{ (state_attr('[[media_player_entity]]', 'entity_id') or ['[[media_player_entity]]']) | first }}"
              hold_action:
                action: repeat
                repeat_delay: 250
            styles: |-
              :host {
                max-width: 128px;
                margin-inline-start: auto;
              }
          - type: dropdown
            entity_id: "{{ ((state_attr('[[media_player_entity]]', 'entity_id') or ['[[media_player_entity]]']) | first) | replace('media_player.', 'select.') ~ '_source' }}"
            value_attribute: state
            option_type: attribute
            option_entity: "{{ ((state_attr('[[media_player_entity]]', 'entity_id') or ['[[media_player_entity]]']) | first) | replace('media_player.', 'select.') ~ '_source' }}"
            option_attribute: options
            option_template:
              label: "{{ option | safe }}"
              icon: "{{ state_attr(config.entity | replace('select.', 'button.') ~ 's_' ~ (option | lower | replace(' ', '_')), 'icon') or 'mdi:import' }}"
              tap_action:
                action: perform-action
                perform_action: select.select_option
                target:
                  entity_id: "{{ config.entity }}"
                data:
                  option: "{{ option | safe }}"
          - type: button
            entity_id: "[[media_player_entity]]"
            icon: mdi:import
            tap_action:
              action: fire-dom-event
              event_type: cf-attributes
              attributes:
                mode: [source]
            styles: |-
              :host {
                flex: 0 0 var(--feature-height, 42px);
              }
          - type: button
            entity_id: "[[media_player_entity]]"
            icon: mdi:volume-high
            tap_action:
              action: fire-dom-event
              event_type: cf-attributes
              attributes:
                mode: [source]
            styles: |-
              :host {
                flex: 0 0 var(--feature-height, 42px);
              }
        styles: |-
          {% set inactive = ['off', 'standby', 'unavailable', 'unknown'] %}
          {% set target = (state_attr('[[media_player_entity]]', 'entity_id')
                           or ['[[media_player_entity]]']) | first %}
          {% set is_off = states('[[media_player_entity]]') in inactive %}
          {% set has_volume = [[show_volume_bool]] %}
          {% set has_source = [[show_source_bool]] and states(target) not in inactive %}

          {% if is_off or not (has_volume or has_source) %}
          :host {
            display: none !important;
          }
          {% endif %}
          @container style(--hide-inline-controls: 1) {
            :host {
              display: none !important;
            }
          }
          custom-feature-dropdown,
          custom-feature-button {
            display: none;
          }
          {% if has_source and not has_volume %}
          custom-feature-spinbox {
            display: none;
          }
          custom-feature-dropdown {
            display: flex;
          }
          {% elif has_source and has_volume %}
          custom-feature-button:nth-of-type(1) {
            display: flex;
          }
          :host([mode='source']) custom-feature-spinbox,
          :host([mode='source']) custom-feature-button:nth-of-type(1) {
            display: none;
          }
          :host([mode='source']) custom-feature-dropdown,
          :host([mode='source']) custom-feature-button:nth-of-type(2) {
            display: flex;
          }
          {% endif %}


# ==============================================================================
# Template: status_chips
# Description: Reusable Mushroom chips row for room headers and the overview.
#              Shows the weather, the number of people at home, counters for
#              active lights, outlets and media, the number of running air
#              conditioners from climate_entities (comma separated, colored by
#              the dominant HVAC mode), the total power draw, temperature and
#              humidity with comfort colors, and dishwasher and washing machine
#              timers. Every chip is optional and only rendered when its entity
#              is set and available; timers also hide while unknown. With
#              weather or home entity (overview) the row is centered, otherwise
#              (room headers) it starts left and a spacer right aligns the
#              climate chips. All chips except the counters open the more-info
#              dialog as a browser_mod popup.
# ==============================================================================

status_chips:
  default:
    - weather_entity: sensor.none
    - home_entity: sensor.none
    - lights_entity: sensor.none
    - outlets_entity: sensor.none
    - media_entity: sensor.none
    - climate_entities: sensor.none
    - power_entity: sensor.none
    - temperature_entity: sensor.none
    - humidity_entity: sensor.none
    - dishwasher_entity: sensor.none
    - washing_machine_entity: sensor.none
  card:
    type: custom:mushroom-chips-card
    alignment_javascript: >-
      return [variables.weather_entity, variables.home_entity].every((entity) => [undefined, '', 'sensor.none'].includes(entity)) ? 'start' : 'center';
    chips:
      - type: conditional
        conditions:
          - condition: state
            entity: "[[weather_entity]]"
            state_not: unavailable
        chip:
          type: weather
          entity: "[[weather_entity]]"
          show_conditions: true
          show_temperature: true
          tap_action:
            action: fire-dom-event
            browser_mod:
              service: sequence
              data:
                sequence:
                  - service: browser_mod.close_popup
                  - service: browser_mod.more_info
                    data:
                      entity: "[[weather_entity]]"
          hold_action:
            action: none
      - type: conditional
        conditions:
          - condition: state
            entity: "[[home_entity]]"
            state_not: unavailable
        chip:
          type: template
          entity: "[[home_entity]]"
          content: >-
            {% set count = states('[[home_entity]]') | int(0) %}
            {{ count if count > 0 else 'Away' }}
          icon: >-
            {{ 'mdi:home-account' if states('[[home_entity]]') | int(0) > 0 else 'mdi:home-outline' }}
          icon_color: "{{ 'green' if states('[[home_entity]]') | int(0) > 0 else 'disabled' }}"
          tap_action:
            action: fire-dom-event
            browser_mod:
              service: sequence
              data:
                sequence:
                  - service: browser_mod.close_popup
                  - service: browser_mod.more_info
                    data:
                      entity: "[[home_entity]]"
          hold_action:
            action: none
      - type: conditional
        conditions:
          - condition: state
            entity: "[[lights_entity]]"
            state_not: unavailable
        chip:
          type: template
          entity: "[[lights_entity]]"
          content: "{{ states('[[lights_entity]]') }}"
          icon: mdi:lightbulb
          icon_color: "{{ 'amber' if states('[[lights_entity]]') | int(0) > 0 else 'disabled' }}"
          tap_action:
            action: none
          hold_action:
            action: none
      - type: conditional
        conditions:
          - condition: state
            entity: "[[outlets_entity]]"
            state_not: unavailable
        chip:
          type: template
          entity: "[[outlets_entity]]"
          content: "{{ states('[[outlets_entity]]') }}"
          icon: mdi:power-plug
          icon_color: "{{ 'blue' if states('[[outlets_entity]]') | int(0) > 0 else 'disabled' }}"
          tap_action:
            action: none
          hold_action:
            action: none
      - type: conditional
        conditions:
          - condition: state
            entity: "[[media_entity]]"
            state_not: unavailable
        chip:
          type: template
          entity: "[[media_entity]]"
          content: "{{ states('[[media_entity]]') }}"
          icon: mdi:play-box-multiple
          icon_color: "{{ 'deep-purple' if states('[[media_entity]]') | int(0) > 0 else 'disabled' }}"
          tap_action:
            action: none
          hold_action:
            action: none
      - type: conditional
        conditions:
          - condition: state
            entity_javascript: >-
              return String(variables.climate_entities).split(',')[0].trim();
            state_not: unavailable
        chip:
          type: template
          content: >-
            {% set ids = '[[climate_entities]]'.split(',') | map('trim') | list %}
            {{ ids | map('states') | reject('in', ['off', 'unavailable', 'unknown']) | list | count }}
          icon: mdi:air-conditioner
          icon_color: >-
            {% set colors = {'heat': 'deep-orange', 'cool': 'blue', 'auto': 'green', 'dry': 'amber', 'fan_only': 'teal'} %}
            {% set ids = '[[climate_entities]]'.split(',') | map('trim') | list %}
            {% set active = colors | select('in', ids | map('states') | list) | list %}
            {{ colors[active[0]] if active else 'disabled' }}
          tap_action:
            action: none
          hold_action:
            action: none
      - type: conditional
        conditions:
          - condition: state
            entity: "[[power_entity]]"
            state_not: unavailable
        chip:
          type: template
          entity: "[[power_entity]]"
          content: >-
            {{ states('[[power_entity]]', with_unit=True) if is_number(states('[[power_entity]]')) else '–' }}
          icon: mdi:flash
          icon_color: "{{ 'amber' if states('[[power_entity]]') | int(0) > 0 else 'disabled' }}"
          tap_action:
            action: fire-dom-event
            browser_mod:
              service: sequence
              data:
                sequence:
                  - service: browser_mod.close_popup
                  - service: browser_mod.more_info
                    data:
                      entity: "[[power_entity]]"
          hold_action:
            action: none
