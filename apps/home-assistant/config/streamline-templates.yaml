# ==============================================================================
# Template: light_smart_control
# Description: Reusable Mushroom light card with inline Custom Features sliders
#              for brightness and color temperature (Kelvin). Dynamically hides
#              manual temperature controls when Adaptive Lighting is active, and
#              collapses all sliders while displaying a status badge when an
#              optional Night Light mode binary sensor is active.
# ==============================================================================

light_smart_control:
  default:
    - name: none
    - icon: mdi:lightbulb
    - light_entity: none
    - night_light_entity: none
    - adaptive_switch_entity: none
    - toggle_script_entity: none
  card:
    type: custom:mushroom-template-card
    entity: "[[light_entity]]"
    primary: >-
      {% set custom_name = '[[name]]' %}
      {% if custom_name and custom_name | lower != 'none' %}
        {{ custom_name }}
      {% else %}
        {{ state_attr('[[light_entity]]', 'friendly_name') | default('Light', true) }}
      {% endif %}
    secondary: >-
      {% set nl_entity = '[[night_light_entity]]' %}
      {% set is_nl = nl_entity and nl_entity | lower != 'none' and is_state(nl_entity, 'on') %}
      {% if is_nl %}
        Nachtlicht
      {% elif is_state('[[light_entity]]', 'on') %}
        {{ ((state_attr('[[light_entity]]', 'brightness') | float(0)) / 2.55) | round(0) }}%
      {% else %}
        {{ state_translated('[[light_entity]]') }}
      {% endif %}
    icon: "[[icon]]"
    color: >-
      {% if is_state('[[light_entity]]', 'on') %}
        {% set rgb = state_attr('[[light_entity]]', 'rgb_color') %}
        {% if rgb %}
          rgb({{ rgb | join(',') }})
        {% else %}
          amber
        {% endif %}
      {% else %}
        disabled
      {% endif %}
    badge_icon: >-
      {% set nl_entity = '[[night_light_entity]]' %}
      {% if nl_entity and nl_entity | lower != 'none' and is_state(nl_entity, 'on') %}
        mdi:weather-night
      {% endif %}
    badge_color: >-
      {% set nl_entity = '[[night_light_entity]]' %}
      {% if nl_entity and nl_entity | lower != 'none' and is_state(nl_entity, 'on') %}
        deep-purple
      {% endif %}
    tap_action:
      action: perform-action
      perform_action: "[[toggle_script_entity]]"
      data:
        light_entity: "[[light_entity]]"
    icon_tap_action:
      action: perform-action
      perform_action: "[[toggle_script_entity]]"
      data:
        light_entity: "[[light_entity]]"
    features_position: inline
    features:
      - type: custom:service-call
        entries:
          - type: slider
            entity_id: "[[light_entity]]"
            value_attribute: brightness
            unit_of_measurement: "%"
            range:
              - 1
              - 100
            tap_action:
              action: perform-action
              perform_action: light.turn_on
              target:
                entity_id: "[[light_entity]]"
              data:
                brightness_pct: "{{ value | int }}"
            styles: |-
              :host {
                --color: var(--feature-color);
                --thumb-transition: none;
              }
          - type: slider
            entity_id: "[[light_entity]]"
            value_attribute: color_temp_kelvin
            unit_of_measurement: " K"
            thumb: line
            range:
              - "{{ state_attr('[[light_entity]]', 'min_color_temp_kelvin') or 2000 }}"
              - "{{ state_attr('[[light_entity]]', 'max_color_temp_kelvin') or 6500 }}"
            tap_action:
              action: perform-action
              perform_action: light.turn_on
              target:
                entity_id: "[[light_entity]]"
              data:
                color_temp_kelvin: "{{ value | int }}"
            styles: |-
              :host {
                --color: linear-gradient(90deg, rgb(255, 160, 0), rgb(255, 255, 251));
                --background-opacity: 1;
                --thumb-transition: none;
              }
          - type: button
            entity_id: "[[light_entity]]"
            icon: mdi:thermometer
            tap_action:
              action: fire-dom-event
              event_type: cf-attributes
              attributes:
                mode:
                  - temp
            styles: |-
              :host {
                flex: 0 0 var(--feature-height, 42px);
              }
          - type: button
            entity_id: "[[light_entity]]"
            icon: mdi:brightness-6
            tap_action:
              action: fire-dom-event
              event_type: cf-attributes
              attributes:
                mode:
                  - temp
            styles: |-
              :host {
                flex: 0 0 var(--feature-height, 42px);
              }
        styles: |-
          {% set nl_entity = '[[night_light_entity]]' %}
          {% set is_nl = nl_entity and nl_entity | lower != 'none' and is_state(nl_entity, 'on') %}
          {% set adapt_sw = '[[adaptive_switch_entity]]' %}
          {% set is_adapt = adapt_sw and adapt_sw | lower != 'none' and is_state(adapt_sw, 'on') %}
          :host {
            --feature-button-spacing: 8px;
            {% if is_nl %}
              display: none !important;
            {% endif %}
          }
          custom-feature-slider:nth-of-type(2) {
            position: absolute;
            visibility: hidden;
          }
          custom-feature-button:nth-of-type(2) {
            display: none;
          }
          {% if is_adapt %}
          custom-feature-button:nth-of-type(1) {
            display: none !important;
          }
          {% else %}
          :host([mode='temp']) custom-feature-slider:nth-of-type(1) {
            position: absolute;
            visibility: hidden;
          }
          :host([mode='temp']) custom-feature-slider:nth-of-type(2) {
            position: relative;
            visibility: visible;
          }
          :host([mode='temp']) custom-feature-button:nth-of-type(1) {
            display: none;
          }
          :host([mode='temp']) custom-feature-button:nth-of-type(2) {
            display: flex;
          }
          {% endif %}