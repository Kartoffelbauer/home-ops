light_adaptive:
  default:
    - name: none
    - icon: mdi:lightbulb
    - light_entity: none
    - night_light_entity: none
    - adaptive_switch_entity: none
    - toggle_script: none
  card:
    type: custom:mushroom-template-card
    entity: "[[light_entity]]"
    primary: >-
      {# Safely resolve card display name with friendly_name fallback #}
      {% set custom_name = '[[name]]' %}

      {% if custom_name and custom_name | lower != 'none' %}
        {{ custom_name }}
      {% else %}
        {{ state_attr('[[light_entity]]', 'friendly_name') | default('Light', true) }}
      {% endif %}
    secondary: >-
      {# Resolve night light entity (use explicit variable or auto-derive from light_entity) #}
      {% set custom_nl = '[[night_light_entity]]' %}
      {% set nl_entity = custom_nl if (custom_nl and custom_nl | lower != 'none') else ('[[light_entity]]' | replace('light.', 'binary_sensor.') | replace('_lights', '_night_light')) %}

      {# Display night mode status, brightness percentage when active, or translated off state #}
      {% if is_state(nl_entity, 'on') %}
        Nachtlicht
      {% elif is_state('[[light_entity]]', 'on') %}
        {{ ((state_attr('[[light_entity]]', 'brightness') | float(0)) / 2.55) | round(0) }}%
      {% else %}
        {{ state_translated('[[light_entity]]') }}
      {% endif %}
    icon: "[[icon]]"
    color: >-
      {# Dynamic RGB color when available, fallback to amber when on, disabled when off #}
      {% if is_state('[[light_entity]]', 'on') %}
        {% set rgb = state_attr('[[light_entity]]', 'rgb_color') %}
        {% if rgb %}
          rgb({{ rgb | join(',') }})
        {% else %}
          amber
        {% endif %}
      {% else %}
        disabled
      {% endif %}
    badge_icon: >-
      {# Display moon badge when night light mode is active #}
      {% set custom_nl = '[[night_light_entity]]' %}
      {% set nl_entity = custom_nl if (custom_nl and custom_nl | lower != 'none') else ('[[light_entity]]' | replace('light.', 'binary_sensor.') | replace('_lights', '_night_light')) %}

      {% if is_state(nl_entity, 'on') %}
        mdi:weather-night
      {% endif %}
    badge_color: >-
      {# Style night mode badge with deep-purple #}
      {% set custom_nl = '[[night_light_entity]]' %}
      {% set nl_entity = custom_nl if (custom_nl and custom_nl | lower != 'none') else ('[[light_entity]]' | replace('light.', 'binary_sensor.') | replace('_lights', '_night_light')) %}

      {% if is_state(nl_entity, 'on') %}
        deep-purple
      {% endif %}
    features_position: inline
    tap_action:
      action: perform-action
      perform_action: "[[toggle_script]]"
      data:
        light_entity: "[[light_entity]]"
    icon_tap_action:
      action: perform-action
      perform_action: "[[toggle_script]]"
      data:
        light_entity: "[[light_entity]]"
    features:
      - type: custom:service-call
        entries:
          # 1. Brightness Slider
          - type: slider
            entity_id: "[[light_entity]]"
            value_attribute: brightness
            unit_of_measurement: "%"
            range:
              - 1
              - 100
            tap_action:
              action: perform-action
              perform_action: light.turn_on
              target:
                entity_id: "[[light_entity]]"
              data:
                brightness_pct: "{{ value | int }}"
            styles: |-
              :host {
                --color: var(--feature-color);
                --thumb-transition: none;
              }

          # 2. Color Temperature Slider (Kelvin)
          - type: slider
            entity_id: "[[light_entity]]"
            value_attribute: color_temp_kelvin
            unit_of_measurement: " K"
            thumb: line
            range:
              - "{{ state_attr('[[light_entity]]', 'min_color_temp_kelvin') or 2000 }}"
              - "{{ state_attr('[[light_entity]]', 'max_color_temp_kelvin') or 6500 }}"
            tap_action:
              action: perform-action
              perform_action: light.turn_on
              target:
                entity_id: "[[light_entity]]"
              data:
                color_temp_kelvin: "{{ value | int }}"
            styles: |-
              :host {
                --color: linear-gradient(90deg, rgb(255, 160, 0), rgb(255, 255, 251));
                --background-opacity: 1;
                --thumb-transition: none;
              }

          # 3. Mode Toggle Button: Switch to Color Temperature (Hidden when Adaptive Lighting is active)
          - type: button
            entity_id: "[[light_entity]]"
            icon: mdi:thermometer
            tap_action:
              action: fire-dom-event
              event_type: cf-attributes
              attributes:
                mode:
                  - temp
            styles: |-
              :host {
                {# Hide temperature toggle if adaptive color is actively managing the light #}
                {% set adapt_sw = '[[adaptive_switch_entity]]' %}
                {% if adapt_sw and adapt_sw | lower != 'none' and is_state(adapt_sw, 'on') %}
                  display: none !important;
                {% endif %}
                flex: 0 0 var(--feature-height, 42px);
              }

          # 4. Mode Toggle Button: Return to Brightness
          - type: button
            entity_id: "[[light_entity]]"
            icon: mdi:brightness-6
            tap_action:
              action: fire-dom-event
              event_type: cf-attributes
              attributes:
                mode:
                  - temp
            styles: |-
              :host {
                flex: 0 0 var(--feature-height, 42px);
              }

        styles: |-
          .row {
            --feature-button-spacing: 8px;
            {# Hide entire slider row when light is in Night Light mode #}
            {% set custom_nl = '[[night_light_entity]]' %}
            {% set nl_entity = custom_nl if (custom_nl and custom_nl | lower != 'none') else ('[[light_entity]]' | replace('light.', 'binary_sensor.') | replace('_lights', '_night_light')) %}
            {% if is_state(nl_entity, 'on') %}
              display: none !important;
            {% endif %}
          }
          /* Toggle visibility between Brightness (1) and Temperature (2) sliders based on row [mode] attribute */
          custom-feature-slider:nth-of-type(2),
          :host([mode='temp']) custom-feature-slider:nth-of-type(1) {
            position: absolute;
            visibility: hidden;
          }
          :host([mode='temp']) custom-feature-slider:nth-of-type(2) {
            position: relative;
            visibility: visible;
          }
          /* Toggle visibility between Thermometer (1) and Brightness (2) mode buttons */
          custom-feature-button:nth-of-type(2),
          :host([mode='temp']) custom-feature-button:nth-of-type(1) {
            display: none;
          }
          :host([mode='temp']) custom-feature-button:nth-of-type(2) {
            display: flex;
          }