# ==============================================================================
# Template: light_smart_control
# Description: Reusable Mushroom light card with inline Custom Features sliders
#              for brightness and color temperature (Kelvin). Dynamically hides
#              manual temperature controls when Adaptive Lighting is active, and
#              collapses all sliders when the light is off, when an optional
#              Night Light mode binary sensor is active, or when a parent sets
#              the flag --light-smart-control-hide-controls: 1 (e.g. the header
#              of an expanded expander card).
# ==============================================================================

light_smart_control:
  default:
    - name: none
    - light_entity: none
    - night_light_entity: none
    - adaptive_color_entity: none
    - toggle_script_entity: none
  card:
    type: custom:mushroom-template-card
    entity: "[[light_entity]]"
    primary: >-
      {% set name = '[[name]]' %}
      {% if name and name | lower != 'none' %}
        {{ name }}
      {% else %}
        {{ state_attr('[[light_entity]]', 'friendly_name') | default('Licht', true) }}
      {% endif %}
    secondary: >-
      {% set nl = '[[night_light_entity]]' %}
      {% set is_nl = nl not in ['none', ''] and is_state(nl, 'on') %}
      {% if is_nl %}
        Nachtlicht
      {% elif is_state('[[light_entity]]', 'on') %}
        {{ (state_attr('[[light_entity]]', 'brightness') | float(0) / 2.55) | round }}%
      {% elif is_state('[[light_entity]]', 'off') %}
        Aus
      {% else %}
        Nicht verfügbar
      {% endif %}
    icon: >-
      {{ 'mdi:lightbulb' if is_state('[[light_entity]]', 'on') else 'mdi:lightbulb-off' }}
    color: >-
      {% if is_state('[[light_entity]]', 'on') %}
        {% set rgb = state_attr('[[light_entity]]', 'rgb_color') %}
        {{ 'rgb(' ~ rgb | join(',') ~ ')' if rgb else 'amber' }}
      {% endif %}
    badge_icon: >-
      {% set nl = '[[night_light_entity]]' %}
      {% if nl not in ['none', ''] and is_state(nl, 'on') %}
        mdi:weather-night
      {% endif %}
    badge_color: >-
      {% set nl = '[[night_light_entity]]' %}
      {% if nl not in ['none', ''] and is_state(nl, 'on') %}
        deep-purple
      {% endif %}
    tap_action:
      action: perform-action
      perform_action: "[[toggle_script_entity]]"
      data:
        light_entity: "[[light_entity]]"
    icon_tap_action:
      action: perform-action
      perform_action: "[[toggle_script_entity]]"
      data:
        light_entity: "[[light_entity]]"
    features_position: inline
    features:
      - type: custom:service-call
        entries:
          - type: slider
            entity_id: "[[light_entity]]"
            value_attribute: brightness
            unit_of_measurement: "%"
            range: [1, 100]
            tap_action:
              action: perform-action
              perform_action: light.turn_on
              target:
                entity_id: "[[light_entity]]"
              data:
                brightness_pct: "{{ value | int }}"
            styles: |-
              :host {
                --color: var(--feature-color);
                --thumb-transition: none;
              }
          - type: slider
            entity_id: "[[light_entity]]"
            value_attribute: color_temp_kelvin
            unit_of_measurement: " K"
            thumb: line
            range:
              - "{{ state_attr('[[light_entity]]', 'min_color_temp_kelvin') or 2000 }}"
              - "{{ state_attr('[[light_entity]]', 'max_color_temp_kelvin') or 6500 }}"
            tap_action:
              action: perform-action
              perform_action: light.turn_on
              target:
                entity_id: "[[light_entity]]"
              data:
                color_temp_kelvin: "{{ value | int }}"
            styles: |-
              :host {
                --color: linear-gradient(90deg, rgb(255, 160, 0), rgb(255, 255, 251));
                --background-opacity: 1;
                --thumb-transition: none;
              }
          - type: button
            entity_id: "[[light_entity]]"
            icon: mdi:thermometer
            tap_action:
              action: fire-dom-event
              event_type: cf-attributes
              attributes:
                mode: [temp]
            styles: |-
              :host {
                flex: 0 0 var(--feature-height, 42px);
              }
          - type: button
            entity_id: "[[light_entity]]"
            icon: mdi:brightness-6
            tap_action:
              action: fire-dom-event
              event_type: cf-attributes
              attributes:
                mode: [temp]
            styles: |-
              :host {
                flex: 0 0 var(--feature-height, 42px);
              }
        styles: |-
          {% set is_off = not is_state('[[light_entity]]', 'on') %}
          {% set nl = '[[night_light_entity]]' %}
          {% set is_nl = nl not in ['none', ''] and is_state(nl, 'on') %}
          {% set adapt = '[[adaptive_color_entity]]' %}
          {% set is_adapt = adapt not in ['none', ''] and is_state(adapt, 'on') %}

          {% if is_off or is_nl %}
          :host {
            display: none !important;
          }
          {% endif %}
          @container style(--light-smart-control-hide-controls: 1) {
            :host {
              display: none !important;
            }
          }
          custom-feature-slider:nth-of-type(2) {
            position: absolute;
            visibility: hidden;
          }
          custom-feature-button:nth-of-type(2) {
            display: none;
          }
          {% if is_adapt %}
          custom-feature-button:nth-of-type(1) {
            display: none !important;
          }
          {% else %}
          :host([mode='temp']) custom-feature-slider:nth-of-type(1) {
            position: absolute;
            visibility: hidden;
          }
          :host([mode='temp']) custom-feature-slider:nth-of-type(2) {
            position: relative;
            visibility: visible;
          }
          :host([mode='temp']) custom-feature-button:nth-of-type(1) {
            display: none;
          }
          :host([mode='temp']) custom-feature-button:nth-of-type(2) {
            display: flex;
          }
          {% endif %}


# ==============================================================================
# Template: projector_smart_control
# Description: Reusable Home Assistant Tile card for stateless IR beamers/projectors.
#              Features an inline volume spinbox with repeat-on-hold, toggles power
#              on tap, and dynamically collapses the entire feature row when off.
# ==============================================================================

projector_smart_control:
  default:
    - entity: none
    - name: Beamer
    - icon: mdi:projector
  card:
    type: tile
    entity: "[[entity]]"
    name: "[[name]]"
    icon: "[[icon]]"
    tap_action:
      action: toggle
    icon_tap_action:
      action: toggle
    features_position: inline
    features:
      - type: custom:service-call
        entries:
          - type: spinbox
            entity_id: "[[entity]]"
            icon: mdi:volume-high
            decrement:
              icon: mdi:volume-minus
              tap_action:
                action: perform-action
                perform_action: media_player.volume_down
                target:
                  entity_id: "[[entity]]"
              hold_action:
                action: repeat
                repeat_delay: 250
            increment:
              icon: mdi:volume-plus
              tap_action:
                action: perform-action
                perform_action: media_player.volume_up
                target:
                  entity_id: "[[entity]]"
              hold_action:
                action: repeat
                repeat_delay: 250
        styles: |-
          :host {
            {% if not is_state('[[entity]]', 'on') %}
            display: none !important;
            {% endif %}
          }