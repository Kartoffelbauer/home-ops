# ==============================================================================
# External Services: Minecraft Server Management (MCSM)
# Description: Reverse proxies traffic exiting the Docker stack to a standalone
#              bare-metal or VM node on the local network (192.168.1.5).
# ==============================================================================
http:
  # --- Ingress: Domain Mapping ---
  routers:
    # Primary Web Interface: MCSManager Control Panel
    mscm-panel:
      entryPoints:
        - websecure
      rule: "Host(`mc.{{ env "DOMAIN_PRIMARY" }}`)"
      service: mscm-panel-svc

    # Backend Node Agent: MCSManager Daemon (Handles terminal & WebSocket traffic)
    mscm-daemon:
      entryPoints:
        - websecure
      rule: "Host(`mc-daemon.{{ env "DOMAIN_PRIMARY" }}`)"
      service: mscm-daemon-svc

    # Public Application: BlueMap 3D Web Map
    bluemap:
      entryPoints:
        - websecure
      rule: "Host(`mc-map.{{ env "DOMAIN_PRIMARY" }}`)"
      service: bluemap-svc

  # --- Egress: Local Network Forwarding ---
  services:
    mscm-panel-svc:
      loadBalancer:
        servers:
          - url: "http://192.168.1.5:23333"

    mscm-daemon-svc:
      loadBalancer:
        servers:
          - url: "http://192.168.1.5:24444"

    bluemap-svc:
      loadBalancer:
        servers:
          - url: "http://192.168.1.5:8080"