# ==============================================================================
# Global Configuration: Security & Routing Policies
# Description: Defines reusable security constraints, fallback logic and
#              TLS hardening applied across the entire Traefik environment.
# ==============================================================================
http:
  middlewares:
    # --- 1. Traffic Control ---
    # Mitigates basic DDoS attacks and prevents brute-force login attempts
    rate-limit:
      rateLimit:
        average: 100
        burst: 300

    # --- 2. Security Headers ---
    # Enforces HTTP Strict Transport Security (HSTS) to guarantee HTTPS connections
    sec-transport:
      headers:
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true

    # --- 3. Dynamic Error Handling ---
    # Catches 403 (Forbidden) and 502-504 (Gateway / App Offline) errors
    error-pages-fallback:
      errors:
        status:
          - "403"
          - "502-504"
        service: "fallback-svc@docker"
        # Dynamic query: Traefik automatically requests /403.html, /502.html, etc.
        query: "/{status}.html"

    # --- 4. Global Chains ---
    # Master middleware pipeline attached to the main websecure entrypoint
    sec-public:
      chain:
        middlewares:
          - sec-transport
          - rate-limit
          - error-pages-fallback

# ==============================================================================
# Global Configuration: TLS / SSL Standards
# ==============================================================================
tls:
  options:
    default:
      # Hardens security by dropping deprecated protocols (TLS 1.0/1.1) and weak ciphers
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305