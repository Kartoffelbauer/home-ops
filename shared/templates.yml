# --- DRY Templates ---
# --- Common Init Template ---
x-init-common: &init-common
  # Lifecycle: Tell Watchtower to ignore all containers using this template
  labels:
    - "com.centurylinklabs.watchtower.enable=false"

  # Security: Drop all privileges and add only required ones back
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  cap_add:
    - CHOWN
    - FOWNER
    - FSETID
    - DAC_OVERRIDE

  # Environment: Set the timezone for all containers using this template
  environment:
      TZ: "${TZ:-Etc/UTC}"

# --- Lifecycle: Default values ---
x-lifecycle-defaults: &lifecycle-defaults
  healthcheck:
    start_period: 120s
    interval: 15s
    timeout: 10s
    retries: 3
  stop_grace_period: 30s

# --- Outbound Dependencies: Default values ---
x-outbound-dependencies: &outbound-dependencies
  depends_on:
    pihole:
      condition: service_healthy


services:
  # --- Basic Init Service: Templates for preparing permissions ---
  base-init:
    <<: *init-common
    image: busybox:${BUSYBOX_DOCKER_TAG:-1.37}

    # Connectivity: Attach to no network
    network_mode: none

    # Security: Lock the filesystem
    read_only: true

  # --- Extended Init Service: Template for more complex initialization needs ---
  base-init-extended:
    <<: [ *init-common, *outbound-dependencies ]
    image: alpine:${ALPINE_DOCKER_TAG:-3.23}

    # Platform: Specify the platform for compatibility
    platform: linux/amd64

    # Connectivity: Allow outbound network access
    networks:
      - outbound-public

  # --- Basic Service Base: Template for basic containers ---
  base-default:
    restart: unless-stopped

    # Monitoring: Keep logs locally and rotate them automatically
    logging:
      driver: local

    # Lifecycle: Inject default lifecycle values locally
    <<: *lifecycle-defaults

  # --- Basic Outbound Dependent Base: For containers requiring active internet/DNS ---
  base-default-outbound:
    extends:
      service: base-default
    <<: *outbound-dependencies

  # --- Secure Service Base: Template for secure containers ---
  base-secure:
    restart: unless-stopped

    # Monitoring: Keep logs locally and rotate them automatically
    logging:
      driver: local

    # Security: Drop all privileges by default
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Environment: Set the timezone for all containers using this template
    environment:
      TZ: "${TZ:-Etc/UTC}"

    # Lifecycle: Inject default lifecycle values locally
    <<: *lifecycle-defaults

  # --- Secure Outbound Dependent Base: For containers requiring active internet/DNS ---
  base-secure-outbound:
    extends:
      service: base-secure
    <<: *outbound-dependencies

# --- Global Network Definitions ---
networks:
  outbound-public: